# =============================================================================
# Predictive Defect Analysis Engine — Packaging (PEP 621)
# =============================================================================
# Install for development:  pip install -e .
# Install dev tooling:      pip install -r requirements-dev.txt
#
# Runtime dependencies are NOT duplicated here — they are read dynamically
# from requirements.txt, which stays the single source of truth. The optional
# FastAPI server reads requirements-webhook.txt the same way.
# =============================================================================

[build-system]
# setuptools>=77 is required for the PEP 639 SPDX string form of `license`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "defect-risk-analyzer"
description = "AI-powered Jira defect risk prediction using RAG and ISTQB principles."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mustafa Can" }]
keywords = ["jira", "qa", "testing", "risk-analysis", "istqb", "rag", "llm"]
dynamic = ["version", "dependencies", "optional-dependencies"]

[project.scripts]
dra = "defect_risk_analyzer.cli:main"

[project.urls]
Homepage = "https://github.com/mcan-k/defect-risk-analyzer"
Repository = "https://github.com/mcan-k/defect-risk-analyzer"

[tool.setuptools.dynamic]
version = { attr = "defect_risk_analyzer.__version__" }
dependencies = { file = ["requirements.txt"] }

# `pip install -e ".[webhook]"` adds the optional FastAPI server.
[tool.setuptools.dynamic.optional-dependencies]
webhook = { file = ["requirements-webhook.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# =============================================================================
# Testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
# src layout: the suite imports the package from a bare checkout, with no
# `pip install -e .` required. An editable install still takes precedence.
# Note this applies to the pytest process only — it does NOT propagate to
# subprocesses, so tests/test_core_boundary.py passes PYTHONPATH explicitly.
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: streamlit AppTest walks; deselect with -m 'not slow'",
]

# =============================================================================
# Linting
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# ---------------------------------------------------------------------------
# Pre-existing violations, quarantined per file and per rule
# ---------------------------------------------------------------------------
# `ruff check .` runs in CI (.github/workflows/tests.yml) and was failing on 70
# violations that predate the test suite. These are suppressed per file and per
# rule rather than through a global `ignore` list, so the rules stay live
# everywhere else — new code under src/ is still checked, including new code in
# other files of the same package.
#
# Deliberate trade-off: a NEW violation of a quarantined rule in one of these
# specific files would also be missed. Each entry is scoped as narrowly as
# possible to limit that, and each is meant to be deleted, not extended.
[tool.ruff.lint.per-file-ignores]
# 37 long lines + 1 unused local. Faz 5 rewrites this file (7 pages -> 4,
# native streamlit pages/, string-matched router deleted); clear both then.
"src/defect_risk_analyzer/dashboard.py" = ["E501", "F841"]

# 9 raise-without-from in the FastAPI handlers. Faz 5 reworks the API contract
# (blind_spot_detector returns structured data); fix the chaining there.
"src/defect_risk_analyzer/api.py" = ["B904"]

# 6 raise-without-from in the provider error mapping. Faz 6 revisits this code
# anyway — Groq matches "rate_limit" while OpenAI matches "rate limit", so a
# message worded for one provider misses the other's branch. Fix together.
"src/defect_risk_analyzer/llm_provider.py" = ["B904"]

# 5 long lines. Faz 4 aligns this module's component names with
# component_classifier, which touches the same report-building code.
"src/defect_risk_analyzer/ci_analyzer.py" = ["E501"]

# Long lines in files with no scheduled rewrite. No phase owns these; clear
# them opportunistically the next time each file is edited.
"src/defect_risk_analyzer/api_models.py" = ["E501"]          # 4
"src/defect_risk_analyzer/prompt_templates.py" = ["E501"]    # 3
"src/defect_risk_analyzer/blind_spot_detector.py" = ["E501"] # 2
"src/defect_risk_analyzer/pattern_detector.py" = ["E501"]    # 2
"src/defect_risk_analyzer/anonymizer.py" = ["E501"]          # 1
