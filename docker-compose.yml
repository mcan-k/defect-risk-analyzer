# =============================================================================
# Predictive Defect Analysis Engine — Docker Compose
# =============================================================================
# Usage:
#   docker-compose up --build        Start both services
#   docker-compose down              Stop and remove containers
#   docker-compose logs -f backend   Follow backend logs
# =============================================================================

services:
  backend:
    build: .
    container_name: defect-risk-backend
    command: uvicorn defect_risk_analyzer.api:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      # On first run ChromaDB downloads its ONNX embedding model (~80MB)
      # during app startup; a short start_period makes the backend look
      # unhealthy and frontend dies with "dependency failed to start".
      start_period: 180s
    restart: unless-stopped

  frontend:
    build: .
    container_name: defect-risk-frontend
    command: streamlit run src/defect_risk_analyzer/dashboard.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    env_file:
      - .env
    volumes:
      - app-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
    driver: local
