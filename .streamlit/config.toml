# =============================================================================
# Streamlit configuration
# =============================================================================
# Read from ${CWD}/.streamlit/config.toml — the PROCESS working directory, not
# the directory holding the entry script. Every documented way of starting this
# app runs from the repository root (README's `streamlit run`, BASLAT.bat, and
# Docker with WORKDIR /app), so this file applies to all of them.
#
# The one launch path it cannot cover is `dra`, which pipx makes runnable from
# any directory. src/defect_risk_analyzer/cli.py passes
# --client.showSidebarNavigation=false explicitly for that reason. The two are
# not redundant: this file is the declaration and covers the documented
# launches, the flag covers a working directory we do not control. A missing
# config file produces no warning at all, which is exactly why the flag exists.
# =============================================================================

[theme]
# The stylesheet in ui/theme.py is built entirely out of rgba(255,255,255,a)
# overlays — it assumes a dark ground but never said so, so a viewer whose
# Streamlit theme resolved to light got white on white. Pinning the base is
# what makes those rules correct by design rather than by luck.
#
# THE COUNT THIS COMMENT USED TO REST ON IS GONE. It said streamlit offers
# "exactly six [theme] options (base, primaryColor, backgroundColor,
# secondaryBackgroundColor, textColor, font)", which was true of 1.41.1 and was
# the whole argument for why none of the 21 rules could move here. Measured
# again on the installed package after the 6D-4a bump — `config._config_options`
# filtered to the `theme.` prefix:
#
#     streamlit 1.41.1 ->   6 options
#     streamlit 1.63.0 -> 277 options (52 top-level, plus 225 under
#                         light./dark./sidebar. and their combinations)
#
# So the premise no longer holds, and 1.63.0 ships names that look directly
# relevant to those rules — borderColor, dataframeBorderColor, showWidgetBorder,
# baseRadius, linkColor, codeBackgroundColor, the chart color palettes.
#
# NOT MEASURED, AND DELIBERATELY NOT CLAIMED EITHER WAY: whether any of the 21
# rules in ui/theme.py is now expressible as a [theme] option. 6D-4a bumped the
# pin; auditing 21 CSS rules against 277 config options is a different piece of
# work and was left out rather than guessed at. What is fixed here is the false
# number, not the design.
#
# Trigger: go through ui/theme.py's 21 rules against the 1.63.0 option list. Any
# rule that maps to an option should move here, where it survives a Streamlit
# internal rename; a hand-rolled selector does not. ui/theme.py:71's
# `iframe[title="streamlit_status_widget"]` is the standing example of that risk
# and nothing tests it.
base = "dark"

[client]
# ui/shell.py:render_nav draws the navigation with st.page_link, so the
# built-in pages/ navigation would be a second, duplicate list above it.
showSidebarNavigation = false
