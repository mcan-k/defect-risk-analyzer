# =============================================================================
# Predictive Defect Analysis Engine — Dependabot
# =============================================================================
# Two ecosystems: github-actions (phase 6D-2) and pip (phase 6D-3c).
#
# An earlier version of this comment said Dependabot "cannot do anything
# meaningful with a lower bound", and that turned out to be false. Measured in
# dependabot-core: with no versioning-strategy set, a project that does not
# match a PyPI package resolves to BumpVersions, and BumpVersions rewrites
# `>=0.115.6` to `>=<latest>` unconditionally. requirements-webhook.txt's four
# `>=` lines would have been rewritten — the exact opposite of that file's
# stated intent. The `versioning-strategy` line below is what actually protects
# them; the belief that they were safe by nature did not.
# =============================================================================

version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"  # workflows are discovered from the repository root

    schedule:
      # Weekly, not daily: three actions do not produce enough churn to justify
      # a daily check, and a daily cadence just turns into PR noise on a
      # single-maintainer repository. Monthly would leave a security bump
      # unnoticed for up to four weeks. A fixed day keeps it predictable.
      interval: weekly
      day: monday

    # One PR for all three actions rather than three. The bumps are mechanical
    # and a single CI run verifies all of them together, so splitting them costs
    # three full CI runs to review the same evidence.
    groups:
      github-actions:
        patterns:
          - "*"

    # With grouping this is effectively 1 PR; an explicit low ceiling is better
    # than inheriting the default of 5 without having thought about it.
    open-pull-requests-limit: 3

    # No target-branch on purpose: it defaults to the repository's default
    # branch, so naming it here would only be configuration that rots if the
    # default branch is ever renamed.

  # ---------------------------------------------------------------------------
  # pip — phase 6D-3c
  # ---------------------------------------------------------------------------
  # What Dependabot will look at, read from dependabot-core rather than guessed:
  # the fetcher selects every file whose name ends in `.txt` or `.in`, and
  # `requirements_file?` accepts any name containing "requirements" outright. So
  # all four requirements files are in scope, not just requirements.txt. `-r`
  # and `-c` lines are followed as well. pyproject.toml is fetched too, but its
  # dependencies are dynamic, so there is no version literal there to update.
  - package-ecosystem: pip
    directory: "/"

    schedule:
      # Same day as the actions ecosystem, for one weekly review pass rather
      # than two.
      interval: weekly
      day: monday

    # THIS LINE PROTECTS requirements-webhook.txt. The default strategy
    # (BumpVersions) rewrites `>=0.115.6` to `>=<latest>` unconditionally;
    # increase-if-necessary starts with `return req if new_version_satisfies?`,
    # so a lower bound that already admits the new version is left untouched.
    # An `==` pin never admits a new version, so the 14 exact pins are still
    # bumped. Net effect: Dependabot acts on the pins and leaves the four
    # deliberate `>=` bounds — whose whole design is "let the resolver decide" —
    # exactly as they are.
    versioning-strategy: increase-if-necessary

    # Risk-tiered, not one bucket. Attribution is cheap for patch/minor bumps
    # and expensive for majors, so majors are NOT grouped: each arrives in its
    # own pull request with its own CI run, and a red run names one package.
    # Everything boring is batched into one weekly pull request instead.
    groups:
      python-patch-minor:
        patterns: ["*"]
        # anyio is excluded because its bump pull request is RED BY DESIGN, not
        # broken. requirements-dev.txt pins anyio==4.14.2 to keep starlette's
        # deprecated anyio.abc alias out of the CI log (phase 6D-3a), and
        # tests/test_dependency_pins.py holds both the literal and the reason —
        # so a 4.15.x bump turns two tests red on purpose. That is the signal we
        # want. Inside the group it would hold every unrelated patch/minor bump
        # hostage to a pull request that can never be merged.
        exclude-patterns: ["anyio"]
        update-types: ["patch", "minor"]

    # Deferred to phase 6D-4. This started as two entries; streamlit's left in
    # 6D-4a and chromadb's is still here.
    #
    # WHAT STREAMLIT'S REMOVAL COST AND BOUGHT, MEASURED (OSV, 2026-09-09).
    # While the entry stood it was silencing two real advisories in streamlit
    # 1.41.1 — CVE-2026-33682 (unauthenticated SSRF / NTLM exposure on Windows,
    # fixed in 1.54.0) and CVE-2026-10804 (st.cache_data hash collision, fixed
    # in 1.53.1) — so the accepted cost below was never theoretical. The bump to
    # 1.63.0 closed both, and closed 18 more: streamlit's `pillow<12` ceiling was
    # the only thing holding pillow at 11.3.0, and lifting it to `pillow<13`
    # resolves pillow 12.3.0. Of the 45 advisory records a full audit of the
    # resolved set returned, 40 were closed by this one bump.
    #
    # WHY CHROMADB IS STILL HERE, AND WHY THE ENTRY IS NARROWED RATHER THAN
    # DELETED. Phase 6D-4b moved the pin 0.5.23 -> 0.6.3 and stopped there. The
    # reason is not CI mechanics, it is a CVE with no released fix:
    #
    #   CVE-2026-45829 (GHSA-f4j7-r4q5-qw2c), CRITICAL, exploit-proof-of-concept:
    #   an UNAUTHENTICATED code injection reached by posting a malicious model
    #   repository with trust_remote_code to the collections endpoint. It affects
    #   `>=1.0.0` and its `last_affected` is 1.5.9 — the newest release — so
    #   there is nowhere to upgrade to.
    #
    # THE >=1.0.0 BOUNDARY IS REAL, NOT A SCANNING ARTEFACT — measured, because
    # "the old versions just were not scanned" was the obvious alternative. The
    # machinery the attack needs is the config-driven embedding-function
    # registry, and it does not exist in 0.5.x: `build_from_config` appears in
    # 42 files / 36 EF classes in 1.5.9 and in 0 files in 0.5.23, and
    # `known_embedding_functions` is read while a collection configuration is
    # deserialised (api/collection_configuration.py, api/types.py). The /api/v2
    # routes exist in 0.5.23 too, so the boundary is explained by that registry,
    # not by the API version.
    #
    # And the server is reachable in BOTH lines: `chroma run` ships in 0.5.23
    # (Python/FastAPI) and in 1.5.9 (a Rust CLI that needs no fastapi at all), so
    # the difference is not "can a server be started" but "does the started
    # server carry a pre-auth RCE". This repo only ever builds a
    # PersistentClient, but the package ships the server to everyone who
    # installs it.
    #
    # The other three chromadb advisories (CVE-2026-45830, -45833, -45831) are
    # open in 0.5.23, 0.6.3 and 1.5.9 alike and none has a fix, so this step
    # neither gains nor loses ground on them. 0.6.3 does lift the
    # `tokenizers<=0.20.3` ceiling, and it keeps `fastapi` in runtime, which is
    # why tests.yml needs no change yet.
    #
    # The structural half — fastapi to the dev extra, tests.yml installing
    # requirements-webhook.txt, -8 packages — is phase 6D-5.
    #
    # REMOVAL TRIGGER, MECHANICAL: a weekly scheduled workflow audits
    # `chromadb>=1.0.0` in pip-audit's requirements mode and goes red when
    # GHSA-f4j7-r4q5-qw2c stops being reported for it **while the other three
    # are still reported** — two conditions together, because an empty result is
    # a broken scan rather than good news.
    #
    # VERSION RANGE, NOT BARE NAME: `versions: [">=1.0.0"]` keeps 0.6.x patch
    # updates flowing while the 1.x line stays deferred. A bare name would have
    # frozen chromadb entirely, which is what 6D-4a's half was criticised for.
    #
    # ACCEPTED COST, MEASURED: ignore silences security updates as well as
    # version updates — GitHub Docs, Controlling which dependencies are updated
    # by Dependabot: "...when it opens pull requests for version updates and
    # security updates." So a CVE announced in chromadb 1.x raises no pull
    # request while this stands. Recorded in docs/KNOWN-DEBT.md.
    # tests/test_dependabot_config.py makes it mechanical: it turns red the
    # moment the pin moves. It has now fired twice, exactly as designed — on
    # 6D-4a naming `streamlit`, and on this bump naming `chromadb`. Both reds
    # were observed BEFORE the entry and the expected-pin table were touched.
    ignore:
      - dependency-name: "chromadb"
        versions: [">=1.0.0"]

    # Chosen, not inherited — but resting on something the documentation does
    # not state: whether a grouped pull request counts as one against this
    # limit. Neither the options reference nor the grouping page says. Day one
    # is expected to be ~10 open pull requests (8 majors + 1 patch/minor group +
    # anyio), and 5 is meant as a work queue that drains as they are merged or
    # closed. If the first scan instead shows the group alone filling the limit
    # and no majors at all, the reading is the other one and this number goes
    # up. That check is part of 6D-3c's closing measurement.
    open-pull-requests-limit: 5
