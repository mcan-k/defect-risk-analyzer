# =============================================================================
# Predictive Defect Analysis Engine — PR Risk Analysis Workflow
# =============================================================================
# Triggers on pull request open/update, runs defect_risk_analyzer.ci_analyzer,
# and posts a risk report as a PR comment.
# =============================================================================

name: PR Risk Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  risk-analysis:
    name: Analyze PR Risk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for diff

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Configure mock mode
        run: |
          cp .env.example .env
          echo "USE_MOCK_DATA=True" >> .env

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > changes.diff

      - name: Run risk analysis
        run: |
          python -m defect_risk_analyzer.ci_analyzer --diff-file changes.diff --output risk_report.md

      - name: Post report as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('risk_report.md', 'utf8');

            // Find existing bot comment to update (avoid duplicates)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- defect-risk-analyzer -->';
            const body = `${marker}\n${report}`;
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
