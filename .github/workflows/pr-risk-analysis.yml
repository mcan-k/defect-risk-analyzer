# =============================================================================
# Predictive Defect Analysis Engine — PR Risk Analysis Workflow
# =============================================================================
# Triggers on pull request open/update, runs defect_risk_analyzer.ci_analyzer,
# and posts a risk report as a PR comment.
# =============================================================================

name: PR Risk Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  risk-analysis:
    name: Analyze PR Risk

    # Dependabot's own pull requests are skipped entirely. Two independent
    # reasons, and they fail in opposite directions — one makes the job break,
    # the other makes it pointless.
    #
    # It would break: a workflow triggered by Dependabot receives a read-only
    # GITHUB_TOKEN whatever the `permissions:` block above says, so the "Post
    # report as PR comment" step below would fail with 403.
    #
    # It would say nothing: Dependabot only edits manifest files, and
    # module-map.json excludes `**/*.txt` and `**/*.toml`, so
    # select_analyzable_files() returns an empty list and the report reads
    # "NOT ASSESSED - changed files did not map to any known module".
    #
    # The job, not just the comment step: this workflow has no `cache: pip`
    # (tests.yml has one), so leaving the analysis running would pay a full
    # 112-package resolve on every bot pull request to produce that empty
    # report (requirements.txt for this job's target, measured again
    # 2026-10-15 with uv 0.12.19 and the constraints file: still 112).
    # Nothing measurable is lost by skipping.
    #
    # OBSERVED, HALF OF IT: Dependabot pull requests have existed here since
    # phase 6D-3c (#24 onwards), and on them this job shows as skipped — #24
    # and #59, for example, both report "Analyze PR Risk: skipped". The 403
    # itself is still not seen, and cannot be while the skip is in place: the
    # job never runs for the bot, so that half is read from the documentation.
    # Removal trigger in docs/KNOWN-DEBT.md.
    if: github.actor != 'dependabot[bot]'

    # Pinned to the same image as tests.yml (phase 6D-4d-1), not ubuntu-latest,
    # which moves to Ubuntu 26 from 2026-10-19. The two workflows already
    # resolve different sets (this one installs requirements.txt only); a
    # platform difference on top would make the gap harder to read.
    # tests/test_workflow_runners.py fails if either file drifts alone.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for diff

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Same constraints file as tests.yml (phase 6D-3b). This job installs
          # requirements.txt only, a subset of tests.yml's set, so `-c` holds
          # every package here to the version tests.yml installs and checks;
          # there is no second equality step. tests/test_workflow_constraints.py
          # keeps the two command lines in step.
          pip install -r requirements.txt -c .github/constraints/ci-linux-py311.txt
          pip install -e . --no-deps

      - name: Configure mock mode
        run: |
          cp .env.example .env
          echo "USE_MOCK_DATA=True" >> .env

      - name: Get PR diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD > changes.diff

      - name: Run risk analysis
        run: |
          python -m defect_risk_analyzer.ci_analyzer --diff-file changes.diff --output risk_report.md

      - name: Post report as PR comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('risk_report.md', 'utf8');

            // Find existing bot comment to update (avoid duplicates)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- defect-risk-analyzer -->';
            const body = `${marker}\n${report}`;
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
