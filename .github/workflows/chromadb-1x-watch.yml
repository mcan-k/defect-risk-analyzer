# =============================================================================
# chromadb 1.x watch — is the deferral in dependabot.yml still justified?
# =============================================================================
# dependabot.yml ignores chromadb >=1.0.0 because every 1.x carries
# CVE-2026-45829 (GHSA-f4j7-r4q5-qw2c) with no released fix. This workflow
# asks, every week, whether the newest 1.x still does (phase 6D-4d-3).
#
# Two scans, because an empty result is not good news. The CONTROL pins the
# one version known to carry the advisory; if the control stops reporting it,
# the scanner or its data is broken, not chromadb fixed. The TARGET is the
# newest 1.x. The other three chromadb advisories are deliberately not a
# condition: all four end at last_affected 1.5.9 (OSV, 2026-10-07), so a new
# release may show none of them. Only one state is green; a broken watcher is
# red under its own title, because GitHub notifies only on failed scheduled
# runs. States, the control version and measurements: the script's
# docstring and docs/KNOWN-DEBT.md ("Faz 6D-4d-3 eki").
#
# The requirement files are written to $RUNNER_TEMP, never into the repo:
# Dependabot collects every requirements file it finds.
# =============================================================================

name: chromadb 1.x watch

on:
  schedule:
    # Wednesday 06:00 UTC: away from Dependabot's Monday run, so the two do
    # not land in the same Actions listing.
    - cron: "0 6 * * 3"
  workflow_dispatch:
  # Changes to the watcher are tested by the watcher itself. It imports the
  # pip-audit gate, so a gate change runs it too, and it installs pip-audit
  # at the version pinned in requirements-dev.txt, so a pip-audit bump does
  # as well (which includes Dependabot's pull requests touching that file).
  pull_request:
    paths:
      - .github/workflows/chromadb-1x-watch.yml
      - .github/scripts/chromadb_1x_watch.py
      - .github/scripts/pip_audit_gate.py
      - requirements-dev.txt

permissions:
  contents: read

jobs:
  watch:
    name: chromadb 1.x watch
    # Same pinned image as tests.yml (phase 6D-4d-1);
    # tests/test_workflow_runners.py holds every workflow to it.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # The version comes from requirements-dev.txt, so Dependabot's bump of
      # that one line moves both workflows. No cache: a fresh resolution is
      # the point.
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pin="$(sed -n 's/^\(pip-audit==[^ #]*\).*/\1/p' requirements-dev.txt)"
          test -n "$pin" || { echo "pip-audit pin not found in requirements-dev.txt"; exit 1; }
          pip install "$pin"

      - name: Write requirement files
        run: python .github/scripts/chromadb_1x_watch.py write-requirements "$RUNNER_TEMP"

      # Report only; the verdict is the next step's. A missing or broken
      # report is red there ("izleyici bozuk"), so swallowing the exit code
      # here cannot turn a crash into a pass.
      - name: pip-audit (control and target, report only)
        run: |
          for which in control target; do
            rc=0
            pip-audit -r "$RUNNER_TEMP/chromadb-$which.txt" --format json \
              -o "$RUNNER_TEMP/chromadb-$which.json" || rc=$?
            echo "pip-audit $which exit code: $rc (1 = vulnerabilities found)"
          done

      # !cancelled(): if an earlier step failed, the verdict still runs and
      # names the breakage under its own title instead of a bare red.
      - name: Verdict
        if: ${{ !cancelled() }}
        run: >-
          python .github/scripts/chromadb_1x_watch.py evaluate
          --control "$RUNNER_TEMP/chromadb-control.json"
          --target "$RUNNER_TEMP/chromadb-target.json"
