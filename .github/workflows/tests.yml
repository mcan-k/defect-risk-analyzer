# =============================================================================
# Predictive Defect Analysis Engine — Lint & Test Workflow
# =============================================================================
# Runs ruff and the pytest suite. Separate from pr-risk-analysis.yml, which
# analyzes the PR diff and posts a comment; the two do not interact.
#
# No .env step: tests/conftest.py points DRA_BASE_DIR at a temporary directory
# and each test generates whatever configuration it needs, so the suite never
# reads repository configuration or writes into the working tree.
# =============================================================================

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test
    # Pinned, not ubuntu-latest (phase 6D-4d-1). The label moves to Ubuntu 26
    # from 2026-10-19 (actions/runner-images#14748), and the resolved package
    # set below is platform-specific, so an unannounced image change would land
    # in the freeze diff as noise. pr-risk-analysis.yml is pinned to the same
    # image so the two workflows do not diverge by platform as well as by
    # resolution. tests/test_workflow_runners.py holds both; the move to 26.04
    # is its own PR, trigger in docs/KNOWN-DEBT.md.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          # setuptools is upgraded, not pinned (phase 6D-4d-2). It is not one
          # of our dependencies: it ships with setup-python's interpreter, and
          # on 2026-10-07 (PR #47) that copy was 79.0.1, which carries
          # CVE-2026-59890 (fixed in 83.0.0). Our build never uses it —
          # `pip install -e .` builds in an isolated env with its own
          # setuptools>=77 — but pip-audit scans this environment and would
          # report it. ubuntu-24.04 does not pin the Python patch release
          # either, so the upgrade also removes that dependency. Measured in
          # #47: 79.0.1 -> 84.0.0, and the record is gone.
          python -m pip install --upgrade pip setuptools
          # requirements-dev.txt starts with `-r requirements.txt`, so this
          # installs the runtime deps plus pytest and the pinned ruff.
          pip install -r requirements-dev.txt
          pip install -e . --no-deps

      # requirements.txt and requirements-dev.txt pin their direct dependencies
      # with `==`; everything else arrives transitively with no upper bound and
      # drifts between runs. It already scrolls past in the install output;
      # this records it in one greppable place so a version change is visible
      # in a log diff.
      #
      # The counts are a dated measurement, not a claim about today. Measured
      # 2026-10-07 in CI (PR #47, ubuntu-24.04): 13 direct, 136 packages, 123
      # transitive. 16 of the 136 arrive with pip-audit (phase 6D-4d-2). One
      # more, aiohttp-retry, arrived that same day with no edit here:
      # kubernetes 37.0.0 (via chromadb) started requiring it. The count had
      # gone stale the same way on 2026-09-25 (opentelemetry-exporter-otlp-
      # common, via chromadb). That drift is the case for phase 6D-3b; the
      # history of this comment's numbers is in docs/KNOWN-DEBT.md.
      #
      # Placed before Ruff and Pytest on purpose: when lint or the suite breaks,
      # knowing what was actually resolved is worth the most, so the record has
      # to be written before anything can fail.
      #
      # Only here, not in pr-risk-analysis.yml: that workflow installs
      # requirements.txt, a subset of this one (same runtime deps, minus
      # pytest/pytest-cov/ruff/pip-audit), so a second freeze would record the same
      # resolution twice.
      - name: pip freeze (resolved dependency versions)
        run: pip freeze

      # Lint first: a formatting failure is cheaper to report than a test run.
      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      # pip-audit runs with no ignores and this step never fails: it only writes
      # the report. The verdict is the next step's, in both directions — a
      # finding not on the ignore list, or an ignored id that is no longer
      # reported (phase 6D-4d-2; design in the gate's docstring). A missing,
      # empty or partial report is red there, so swallowing pip-audit's exit
      # code here cannot turn a crash into a pass.
      #
      # After Pytest, so an advisory published overnight cannot erase a PR's
      # test evidence (phase 6D-3c's lesson: a step that fails first hides
      # every step after it). `!cancelled()` lets both audit steps run even
      # when Ruff or Pytest failed, for the same reason in the other direction.
      - name: pip-audit (report only)
        if: ${{ !cancelled() }}
        run: |
          rc=0
          pip-audit --format json -o "$RUNNER_TEMP/pip-audit.json" || rc=$?
          echo "pip-audit exit code: $rc (1 = vulnerabilities found)"

      - name: pip-audit gate
        if: ${{ !cancelled() }}
        run: >-
          python .github/scripts/pip_audit_gate.py
          --report "$RUNNER_TEMP/pip-audit.json"
          --ignore .github/pip-audit-ignore.toml
